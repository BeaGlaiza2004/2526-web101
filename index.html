<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Login Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0c111b; /* Dark background */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .background-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
        }

        .background-layer {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            animation: parallax 60s linear infinite;
        }

        .background-layer:nth-child(1) {
            background-image: url('https://images.unsplash.com/photo-1533228876820-dd1176e3ca63?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80'); /* Replace with your image */
            animation-delay: 0s;
        }

        .background-layer:nth-child(2) {
            background-image: url('https://images.unsplash.com/photo-1542654058-715730189113?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80'); /* Replace with your image */
            animation-delay: 20s;
        }

        .background-layer:nth-child(3) {
            background-image: url('https://images.unsplash.com/photo-1519682337058-a94d519337bc?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80'); /* Replace with your image */
            animation-delay: 40s;
        }

        @keyframes parallax {
            0% {
                transform: translate(0, 0) scale(1.1);
            }
            50% {
                transform: translate(5%, 5%) scale(1.2);
            }
            100% {
                transform: translate(0, 0) scale(1.1);
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.08); /* Glassmorphism */
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 60px;
            text-align: center;
            backdrop-filter: blur(10px); /* Add blur */
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden; /* Hide the glow overflow */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.5);
        }

        /* Dynamic Lighting Effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 500px;
            height: 500px;
            background: linear-gradient(to right, rgba(255, 0, 0, 0.2), rgba(0, 0, 255, 0.2), rgba(255, 255, 0, 0.2));
            animation: lighting 10s linear infinite;
            transition: all 0.75s;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 500px;
            height: 500px;
            background: linear-gradient(to bottom, rgba(255, 0, 0, 0.2), rgba(0, 0, 255, 0.2), rgba(255, 255, 0, 0.2));
            animation: lighting 10s linear infinite;
            transition: all 0.75s;
        }

        @keyframes lighting {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .logo {
            width: 150px;
            margin-bottom: 50px;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 18px;
            margin: 20px 0;
            border: none;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 18px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background-color: rgba(255, 255, 255, 0.2);
            outline: none;
            transform: scale(1.03);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            background: linear-gradient(to right, #43cea2, #185a9d);
            color: white;
            padding: 20px 35px;
            margin: 25px 0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 20px;
            letter-spacing: 1px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
        }

        /* Ripple Effect */
        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            width: 0;
            height: 0;
            background-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            animation: rippleEffect 0.6s linear;
        }

        @keyframes rippleEffect {
            0% {
                width: 0;
                height: 0;
                opacity: 0.7;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle 20s linear infinite;
            opacity: 0;
            background-color: rgba(100, 149, 237, 0.4); /* Cornflower Blue */
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translate(calc(var(--x) * 1px), calc(var(--y) * 1px)) scale(1);
                opacity: 0;
            }
        }

        /* Example Particle Styles */
        .particle:nth-child(1) {
            width: 8px;
            height: 8px;
            --x: 100;
            --y: -70;
            animation-delay: 0s;
            top: 15%;
            left: 25%;
        }

        .particle:nth-child(2) {
            width: 10px;
            height: 10px;
            --x: -80;
            --y: 90;
            animation-delay: 4s;
            top: 35%;
            left: 65%;
        }

        .particle:nth-child(3) {
            width: 7px;
            height: 7px;
            --x: 70;
            --y: 80;
            animation-delay: 8s;
            top: 75%;
            left: 35%;
        }

        .particle:nth-child(4) {
            width: 9px;
            height: 9px;
            --x: -90;
            --y: -100;
            animation-delay: 12s;
            top: 85%;
            left: 85%;
        }

    </style>
</head>
<body>
    <div class="background-container">
        <div class="background-layer"></div>
        <div class="background-layer"></div>
        <div class="background-layer"></div>
    </div>

    <div class="container">
        <div class="card">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.7)'%3E%3Cpath d='M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z'/%3E%3C/svg%3E" alt="Logo" class="logo">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button class="btn">Login<span class="ripple"></span></button>
        </div>
    </div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.btn');

        buttons.forEach(btn => {
            btn.addEventListener('click', function (e) {
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;

                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
</body>
</html>
